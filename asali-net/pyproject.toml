[tool.uv.workspace]
members = ["packages/asali_codes", "packages/asali_text", "services/node", "services/directory"]

[dependency-groups]
dev = ["pytest==9.2.0", "hypothesis==6.170.15", "ruff==0.17.5", "mypy==2.4.1", "httpx==0.28.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "--import-mode=importlib -q --ignore=docs/vibe/generated"
testpaths = ["packages", "services", "docs/vibe", "infra", "seed", "tests"]
pythonpath = ["docs/vibe", "packages/asali_codes/tests", "services/node/tests/verify"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
markers = ["network: needs the running simulation network (--simulation-up)"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["apps", "ml/data", "docs/plan", "docs/vibe/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF007", "RUF028", "RUF059"]  # the formatter wraps what it can; SQL text, templates and test data stay on one line

[tool.ruff.lint.per-file-ignores]
# SQL text and test data stay one clause or one record per line
"services/node/asali_node/**/*.py" = ["E501", "B008"]
"services/node/tests/**/*.py" = ["E501", "UP031"]
"infra/**/*.py" = ["E501", "E402", "RUF012"]
"seed/**/*.py" = ["E501", "E402"]

[tool.mypy]
python_version = "3.11"
files = ["packages/asali_codes/asali_codes"]
strict = true
