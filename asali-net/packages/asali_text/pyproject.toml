[project]
name = "asali-text"
version = "0.1.0"
description = "Text pipeline and ML models for linking documents to structured records"
requires-python = ">=3.11,<3.12"
dependencies = ["asali-codes", "scikit-learn==1.9.1", "rapidfuzz==3.14.6", "scipy==1.17.1", "numpy==2.4.6", "joblib==1.6.0"]

[tool.uv.sources]
asali-codes = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["asali_text"]
