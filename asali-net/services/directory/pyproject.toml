[project]
name = "asali-directory"
version = "0.1.0"
description = "Network directory: organisation addresses and public keys, no medicine data"
requires-python = ">=3.11,<3.12"
dependencies = ["fastapi==0.164.0", "uvicorn[standard]==0.54.0", "pydantic-settings==2.16.3", "cryptography==50.0.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["asali_directory"]
