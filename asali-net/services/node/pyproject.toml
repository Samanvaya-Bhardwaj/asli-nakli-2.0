[project]
name = "asali-node"
version = "0.1.0"
description = "One organisation's node: portal API, read-only share API, verify engine, text vault"
requires-python = ">=3.11,<3.12"
dependencies = [
  "asali-codes", "asali-text",
  "fastapi==0.164.0", "uvicorn[standard]==0.54.0", "pydantic-settings==2.16.3",
  "psycopg[binary,pool]==3.3.9", "pymongo==4.20.0", "httpx==0.28.1", "cryptography==50.0.2", "bcrypt==5.0.0", "meilisearch==0.43.0",
]

[tool.uv.sources]
asali-codes = { workspace = true }
asali-text = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["asali_node"]
