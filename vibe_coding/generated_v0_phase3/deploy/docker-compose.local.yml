# Phase 3 on ONE computer with Docker: four database containers + coordinator.
# Still a single-host simulation (the coordinator reports SINGLE_HOST_NETWORKED),
# but each container sees only its own data directory, mounted read-only.
#
#   python scripts/prepare_node_data.py
#   docker compose --env-file deploy/local.env -f deploy/docker-compose.local.yml up --build
#
# Tokens come from the --env-file; addresses are the containers' service names.
name: asali-phase3-local

x-node: &node
  build:
    context: ..
    dockerfile: Dockerfile.phase3
  image: asali-phase3:latest
  restart: unless-stopped

x-node-env: &node-env
  ASALI_MACHINE_LABEL: docker-single-host
  ASALI_PHYSICAL_HOST: ${COMPUTERNAME:-docker-host}

services:
  db1:
    <<: *node
    command: ["python", "api/node_db.py", "--db", "db1", "--port", "8021"]
    environment: {<<: *node-env, ASALI_DB1_TOKEN: "${ASALI_DB1_TOKEN}"}
    volumes: ["./nodes/db1:/data:ro"]
    ports: ["8021:8021"]
  db2:
    <<: *node
    command: ["python", "api/node_db.py", "--db", "db2", "--port", "8022"]
    environment: {<<: *node-env, ASALI_DB2_TOKEN: "${ASALI_DB2_TOKEN}"}
    volumes: ["./nodes/db2:/data:ro"]
    ports: ["8022:8022"]
  db3:
    <<: *node
    command: ["python", "api/node_db.py", "--db", "db3", "--port", "8023"]
    environment: {<<: *node-env, ASALI_DB3_TOKEN: "${ASALI_DB3_TOKEN}"}
    volumes: ["./nodes/db3:/data:ro"]
    ports: ["8023:8023"]
  db4:
    <<: *node
    command: ["python", "api/node_db.py", "--db", "db4", "--port", "8024"]
    environment: {<<: *node-env, ASALI_DB4_TOKEN: "${ASALI_DB4_TOKEN}"}
    volumes: ["./nodes/db4:/data:ro"]
    ports: ["8024:8024"]
  coordinator:
    <<: *node
    command: ["python", "api/coordinator_service.py", "--port", "8030"]
    environment:
      <<: *node-env
      ASALI_FEDERATION: remote
      ASALI_COORDINATOR_BIND: 0.0.0.0
      ASALI_DB_DIR: /state                       # its own audit ledger only
      ASALI_NOSQL_FILE: /state/no_database_here.json
      ASALI_DB1_URL: http://db1:8021
      ASALI_DB2_URL: http://db2:8022
      ASALI_DB3_URL: http://db3:8023
      ASALI_DB4_URL: http://db4:8024
      ASALI_DB1_TOKEN: "${ASALI_DB1_TOKEN}"
      ASALI_DB2_TOKEN: "${ASALI_DB2_TOKEN}"
      ASALI_DB3_TOKEN: "${ASALI_DB3_TOKEN}"
      ASALI_DB4_TOKEN: "${ASALI_DB4_TOKEN}"
      ASALI_DB1_MACHINE: docker-single-host
      ASALI_DB2_MACHINE: docker-single-host
      ASALI_DB3_MACHINE: docker-single-host
      ASALI_DB4_MACHINE: docker-single-host
    volumes: ["coordinator-state:/state"]
    ports: ["8030:8030"]
    depends_on: [db1, db2, db3, db4]

volumes:
  coordinator-state:
